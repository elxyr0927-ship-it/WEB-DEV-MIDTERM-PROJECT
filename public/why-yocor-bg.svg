<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" aria-label="Express Shipping Tech Background SVG">
  <defs>
    <!-- Geometric Tech Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1D3563" stroke-width="1" opacity="0.08"/>
      <circle cx="40" cy="40" r="1.5" fill="#F37B23" opacity="0.25"/>
    </pattern>

    <!-- Speed Dash Gradient -->
    <linearGradient id="speedOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F37B23" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <rect width="1000" height="600" fill="url(#techGrid)"/>

  <!-- Dynamic Express Speed Lines (Abstract Logistics Tech Motif) -->
  <g stroke-linecap="round" opacity="0.35">
    <path d="M -50 100 L 450 100 M 500 100 L 750 100" stroke="url(#speedOrange)" stroke-width="3" stroke-dasharray="30 15"/>
    <path d="M 100 220 L 600 220 M 650 220 L 950 220" stroke="url(#speedOrange)" stroke-width="4" stroke-dasharray="40 20"/>
    <path d="M -20 360 L 380 360 M 430 360 L 880 360" stroke="#1D3563" stroke-width="2.5" stroke-dasharray="25 15" opacity="0.3"/>
    <path d="M 200 480 L 800 480 M 850 480 L 1050 480" stroke="url(#speedOrange)" stroke-width="3" stroke-dasharray="35 15"/>
  </g>

  <!-- Abstract GPS Location Wave Circles -->
  <g fill="none" stroke="#1D3563" opacity="0.12" transform="translate(850, 150)">
    <circle cx="0" cy="0" r="40" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="80" stroke-width="1.5" stroke-dasharray="10 10"/>
    <circle cx="0" cy="0" r="130" stroke-width="1.5"/>
  </g>

  <!-- Subtle Chevron Speed Arrows -->
  <g fill="#F37B23" opacity="0.08">
    <path d="M 750 280 L 780 300 L 750 320 L 765 300 Z"/>
    <path d="M 785 280 L 815 300 L 785 320 L 800 300 Z"/>
    <path d="M 820 280 L 850 300 L 820 320 L 835 300 Z"/>
  </g>
</svg>
