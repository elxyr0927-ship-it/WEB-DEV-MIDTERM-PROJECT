<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" aria-label="Global Logistics Supply Chain Network SVG Map">
  <defs>
    <linearGradient id="routeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F37B23" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="routeNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D3563" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Pulsing Node Glow Filter -->
    <filter id="glowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F37B23" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- World Continents Dot Matrix Background -->
  <g fill="#1D3563" opacity="0.12">
    <!-- North America Dots -->
    <circle cx="150" cy="110" r="2.5"/><circle cx="170" cy="110" r="2.5"/><circle cx="190" cy="110" r="2.5"/><circle cx="210" cy="110" r="2.5"/>
    <circle cx="140" cy="130" r="2.5"/><circle cx="160" cy="130" r="2.5"/><circle cx="180" cy="130" r="2.5"/><circle cx="200" cy="130" r="2.5"/><circle cx="220" cy="130" r="2.5"/>
    <circle cx="150" cy="150" r="2.5"/><circle cx="170" cy="150" r="2.5"/><circle cx="190" cy="150" r="2.5"/><circle cx="210" cy="150" r="2.5"/>
    <circle cx="180" cy="170" r="2.5"/><circle cx="200" cy="170" r="2.5"/>

    <!-- Europe / Asia Dots -->
    <circle cx="580" cy="90" r="2.5"/><circle cx="600" cy="90" r="2.5"/><circle cx="620" cy="90" r="2.5"/><circle cx="640" cy="90" r="2.5"/><circle cx="660" cy="90" r="2.5"/>
    <circle cx="560" cy="110" r="2.5"/><circle cx="580" cy="110" r="2.5"/><circle cx="600" cy="110" r="2.5"/><circle cx="620" cy="110" r="2.5"/><circle cx="640" cy="110" r="2.5"/><circle cx="660" cy="110" r="2.5"/><circle cx="680" cy="110" r="2.5"/><circle cx="700" cy="110" r="2.5"/>
    <circle cx="570" cy="130" r="2.5"/><circle cx="590" cy="130" r="2.5"/><circle cx="610" cy="130" r="2.5"/><circle cx="630" cy="130" r="2.5"/><circle cx="650" cy="130" r="2.5"/><circle cx="670" cy="130" r="2.5"/><circle cx="690" cy="130" r="2.5"/>

    <!-- East Asia & Pacific Rim Dots -->
    <circle cx="880" cy="120" r="2.5"/><circle cx="900" cy="120" r="2.5"/><circle cx="920" cy="120" r="2.5"/><circle cx="940" cy="120" r="2.5"/><circle cx="960" cy="120" r="2.5"/>
    <circle cx="870" cy="140" r="2.5"/><circle cx="890" cy="140" r="2.5"/><circle cx="910" cy="140" r="2.5"/><circle cx="930" cy="140" r="2.5"/><circle cx="950" cy="140" r="2.5"/><circle cx="970" cy="140" r="2.5"/><circle cx="990" cy="140" r="2.5"/>
    <circle cx="880" cy="160" r="2.5"/><circle cx="900" cy="160" r="2.5"/><circle cx="920" cy="160" r="2.5"/><circle cx="940" cy="160" r="2.5"/><circle cx="960" cy="160" r="2.5"/><circle cx="980" cy="160" r="2.5"/>
    <circle cx="910" cy="180" r="2.5"/><circle cx="930" cy="180" r="2.5"/><circle cx="950" cy="180" r="2.5"/><circle cx="970" cy="180" r="2.5"/>

    <!-- South America Dots -->
    <circle cx="310" cy="240" r="2.5"/><circle cx="330" cy="240" r="2.5"/><circle cx="350" cy="240" r="2.5"/>
    <circle cx="320" cy="260" r="2.5"/><circle cx="340" cy="260" r="2.5"/><circle cx="360" cy="260" r="2.5"/><circle cx="380" cy="260" r="2.5"/>
    <circle cx="330" cy="280" r="2.5"/><circle cx="350" cy="280" r="2.5"/><circle cx="370" cy="280" r="2.5"/>
    <circle cx="340" cy="300" r="2.5"/><circle cx="360" cy="300" r="2.5"/>

    <!-- Africa Dots -->
    <circle cx="580" cy="210" r="2.5"/><circle cx="600" cy="210" r="2.5"/><circle cx="620" cy="210" r="2.5"/>
    <circle cx="570" cy="230" r="2.5"/><circle cx="590" cy="230" r="2.5"/><circle cx="610" cy="230" r="2.5"/><circle cx="630" cy="230" r="2.5"/>
    <circle cx="580" cy="250" r="2.5"/><circle cx="600" cy="250" r="2.5"/><circle cx="620" cy="250" r="2.5"/>
    <circle cx="590" cy="270" r="2.5"/><circle cx="610" cy="270" r="2.5"/>
  </g>

  <!-- Arced Flight / Logistics Route Lines -->
  <g stroke-linecap="round" fill="none">
    <!-- Route 1: North America to Europe -->
    <path d="M 200 130 Q 390 40 600 110" stroke="#F37B23" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.75"/>
    <!-- Route 2: Europe to East Asia -->
    <path d="M 600 110 Q 770 50 930 140" stroke="#F37B23" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.75"/>
    <!-- Route 3: North America to South America -->
    <path d="M 200 130 Q 260 200 340 260" stroke="#1D3563" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
    <!-- Route 4: Europe to Africa -->
    <path d="M 600 110 Q 610 180 600 250" stroke="#1D3563" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
    <!-- Route 5: East Asia to Southeast Asia Hub -->
    <path d="M 930 140 Q 860 210 940 280" stroke="#F37B23" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  </g>

  <!-- Major Logistics Hub Nodes -->
  <!-- Hub 1: Americas Hub -->
  <g transform="translate(200, 130)" filter="url(#glowOrange)">
    <circle cx="0" cy="0" r="10" fill="#F37B23" opacity="0.2"/>
    <circle cx="0" cy="0" r="5" fill="#F37B23"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Hub 2: European Central Hub -->
  <g transform="translate(600, 110)" filter="url(#glowOrange)">
    <circle cx="0" cy="0" r="12" fill="#1D3563" opacity="0.3"/>
    <circle cx="0" cy="0" r="6" fill="#1D3563"/>
    <circle cx="0" cy="0" r="2.5" fill="#F37B23"/>
  </g>

  <!-- Hub 3: Asia Express Gateway Hub -->
  <g transform="translate(930, 140)" filter="url(#glowOrange)">
    <circle cx="0" cy="0" r="14" fill="#F37B23" opacity="0.25"/>
    <circle cx="0" cy="0" r="7" fill="#F37B23"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>
</svg>
